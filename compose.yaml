name: yz-auth

services:
  yz-auth:
    image: ${IMAGE_REF:?set IMAGE_REF to a pinned yz-auth image}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.yz-auth.rule: "Host(`${DOMAIN:?set DOMAIN in .env}`)"
      traefik.http.routers.yz-auth.entrypoints: "websecure"
      traefik.http.routers.yz-auth.tls.certresolver: "letsencrypt"
      traefik.http.routers.yz-auth.middlewares: "security-headers@file,compress@file"
      traefik.http.services.yz-auth.loadbalancer.server.port: "3000"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: ${IMAGE_REF:?set IMAGE_REF to a pinned yz-auth image}
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    command: ["node", "dist/cli.js", "db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: yz_auth
      POSTGRES_USER: yz_auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yz_auth -d yz_auth"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  proxy:
    external: true

volumes:
  postgres-data:
